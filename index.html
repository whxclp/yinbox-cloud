<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音盒 · 云端版</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161b22">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23121212'/%3E%3Ctext x='12' y='17' font-size='13' text-anchor='middle' fill='%23ffd93d' font-family='sans-serif'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#f0f0f0; --sub:#8b949e;
    --acc:#ffd93d; --btn:#21262d; --btn-hi:#2d333b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,input{font-family:inherit}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100%;
    padding-top:142px;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:12px 16px;
  }
  header h1{font-size:18px; font-weight:700; letter-spacing:.5px; display:flex; align-items:center; gap:8px;}
  header h1 .note{color:var(--acc);}
  header p{color:var(--sub); font-size:14px; margin-top:2px;}
  .toolbar{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .toolbar input{
    flex:1; min-width:140px; background:var(--btn); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:9px 12px; font-size:16px; outline:none;
  }
  .toolbar input:focus{border-color:var(--acc);}
  .toolbar button{
    background:var(--btn); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 14px; font-size:15px; cursor:pointer; white-space:nowrap;
    min-height:44px;
  }
  .toolbar button:active,.toolbar button.on{background:var(--btn-hi); border-color:var(--acc);}
  main{flex:1; overflow-y:auto; padding:12px 16px 20px;}
  .stat{color:var(--sub); font-size:13px; margin:4px 2px 10px;}
  .group-title{
    font-size:14px; color:var(--acc); font-weight:700; margin:14px 0 8px;
    display:flex; align-items:center; gap:8px;
  }
  .group-title::before{content:''; width:4px; height:14px; background:var(--acc); border-radius:2px; display:inline-block;}
  .song{
    display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; cursor:pointer;
  }
  .song:active{background:var(--btn-hi);}
  .song.playing{border-color:var(--acc);}
  .song .idx{
    width:26px; height:26px; border-radius:50%; background:var(--btn); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub); flex:none;
  }
  .song.playing .idx{background:var(--acc); color:#111; border-color:var(--acc);}
  .song .meta{flex:1; min-width:0;}
  .song .t{font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .song .a{font-size:12px; color:var(--sub); margin-top:2px;}
  .song .tag{
    font-size:11px; padding:2px 8px; border-radius:6px; border:1px solid var(--line);
    color:var(--sub); flex:none;
  }
  .song .tag.i{color:var(--acc); border-color:var(--acc);}
  .song .tag.m{color:#7ee787; border-color:#7ee787;}
  .song .heart{
    flex:none; width:36px; height:36px; border-radius:50%; font-size:18px; line-height:1;
    background:transparent; border:none; color:var(--sub); cursor:pointer; display:flex;
    align-items:center; justify-content:center;
  }
  .song .heart.on{color:#ff4d4f;}
  /* ===== 网上搜歌 ===== */
  #onlineSearch{position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:100; padding:14px; overflow-y:auto; display:none;}
  #onlineSearch .tip{font-size:13px; color:var(--sub); margin:8px 2px 0; line-height:1.7;}
  #searchTop{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #searchTop .tt{font-size:20px; font-weight:bold;}
  #searchClose{font-size:16px; cursor:pointer; padding:8px 14px; color:var(--text); background:var(--btn); border:1px solid var(--line); border-radius:8px;}
  .oitem{
    display:flex; align-items:center; gap:8px; padding:8px 12px; margin-bottom:6px;
    background:var(--btn); border:1px solid var(--line); border-radius:10px;
  }
  .oitem .src{font-size:11px; padding:2px 6px; border-radius:5px; border:1px solid var(--line); color:var(--sub); flex:none;}
  .oitem .src.n{color:#7ee787; border-color:#7ee787;}
  .oitem .src.k{color:#79c0ff; border-color:#79c0ff;}
  .oitem .src.b{color:#bc8cff; border-color:#bc8cff;}
  .oitem .meta{flex:1; min-width:0;}
  .oitem .t{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .oitem .a{font-size:12px; color:var(--sub); margin-top:2px;}
  .oitem button{
    flex:none; min-height:36px; padding:0 12px; border-radius:8px; cursor:pointer;
    font-size:14px; font-weight:bold; border:1px solid var(--line);
  }
  .oitem .play{background:var(--acc); color:#111; border-color:var(--acc);}
  #list.fav-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding-top:4px;}
  #list.fav-grid .group-title{grid-column:1/-1;}
  #list.fav-grid .song{flex-direction:column; align-items:center; text-align:center; padding:12px 6px; border-radius:10px; min-height:64px;}
  #list.fav-grid .idx{display:none;}
  #list.fav-grid .t{font-size:16px; font-weight:bold; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  #list.fav-grid .a{font-size:12px; color:var(--sub); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  #list.fav-grid .heart{position:static; margin-top:6px; font-size:22px;}
  #list.fav-grid .tag{display:none;}
  .oitem .want{background:var(--btn-hi); color:var(--text);}
  .oitem .wanted{background:transparent; color:var(--sub); border-style:dashed;}
  .empty{padding:40px 20px; text-align:center; color:var(--sub); font-size:14px; line-height:1.9;}
  /* ===== MV 画面区 ===== */
  #mvWrap{
    position:fixed; left:50%; top:170px; transform:translateX(-50%);
    width:min(92vw,560px); z-index:18; display:none; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 6px 24px rgba(0,0,0,.5); background:#000;
  }
  #mvWrap video{display:block; width:100%; max-height:46vh; background:#000;}
  /* ===== 播放器条 ===== */
  .player{
    position:fixed; left:0; right:0; top:0; background:var(--panel);
    border-bottom:1px solid var(--line); padding:8px 14px 10px; z-index:20;
  }
  .prog{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .prog .t{font-size:12px; color:var(--sub); width:42px; text-align:center; flex:none;}
  .bar{flex:1; height:22px; display:flex; align-items:center; cursor:pointer; position:relative;}
  .bar .track{width:100%; height:4px; background:var(--btn-hi); border-radius:2px; position:relative;}
  .bar .fill{position:absolute; left:0; top:0; bottom:0; background:var(--acc); border-radius:2px; width:0%;}
  .bar .knob{
    position:absolute; left:0%; top:50%; transform:translate(-50%,-50%);
    width:14px; height:14px; border-radius:50%; background:var(--acc); box-shadow:0 0 6px rgba(0,0,0,.4);
  }
  .now{margin-bottom:6px;}
  .now .nt{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .now .na{font-size:12px; color:var(--sub);}
  .ctrls{display:flex; align-items:center; justify-content:center; gap:22px;}
  .ctrls button{
    background:transparent; border:none; color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ctrls .big{min-width:64px; height:52px; padding:0 12px; border-radius:26px; background:var(--acc); color:#111; font-size:18px; font-weight:bold;}
  .ctrls .small{min-width:44px; min-height:44px; color:var(--sub);}
  .ctrls .small.on{color:var(--acc);}
  .ctrls button:disabled{opacity:.3; cursor:default;}
  .ctrls svg{display:block;}
  .lyric{
    position:fixed; left:50%; top:158px; transform:translateX(-50%);
    max-width:86%; text-align:center; font-size:13px; color:var(--sub);
    background:rgba(13,17,23,.92); border:1px solid var(--line); border-radius:10px;
    padding:6px 12px; z-index:15; pointer-events:none; display:none;
  }
  .lyric.plain{
    pointer-events:auto; overflow-y:auto; max-height:38vh;
    font-size:14px; line-height:1.8; padding:10px 16px;
  }
  .lyric.plain .lrcline{padding:1px 0;}
  @media (max-width:480px){
    .ctrls{gap:16px;}
    .ctrls .big{min-width:56px; height:46px; font-size:16px;}
  }
</style>
</head>
<body>
<header>
  <h1><span class="note">♪</span> 音盒 · 云端版</h1>
  <p>歌在云端，任何设备随时听 · 免注册 · 无广告</p>
  <div class="toolbar">
    <input id="kw" placeholder="筛选本地歌单" autocomplete="off" style="display:none">
    <button id="favFilter" onclick="toggleFavFilter()">只看收藏</button>
    <button onclick="toggleOnline()" id="onlineBtn">网上搜歌</button>
  </div>
  <div id="onlineSearch">
    <div id="searchTop"><span class="tt">搜全网</span><span id="searchClose" onclick="toggleOnline()">关闭</span></div>
    <div id="ohist" style="margin-bottom:8px;"></div>
    <div style="display:flex; gap:8px;">
      <input id="okw" placeholder="搜全网：歌名 / 歌手（回车搜索）" autocomplete="off"
        style="flex:1;min-width:120px;background:var(--btn);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:17px;outline:none">
      <button onclick="searchOnline()" style="background:var(--btn);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer;min-height:44px;white-space:nowrap">搜索</button>
    </div>
    <div id="oresults"></div>
    <div class="tip">试听 = 直接播放。归队 = 标记要加入歌单，把标记清单发给豆包后批量下载。VIP/不能播的已自动过滤。</div>
  </div>
</header>
<main id="list"><div class="empty">正在加载歌单…</div></main>
<div id="mvWrap"><video id="mvPlayer" playsinline></video></div>
<div class="lyric" id="lyricBox"></div>
<div class="player">
  <div class="prog">
    <span class="t" id="cur">0:00</span>
    <div class="bar" id="progBar"><div class="track"><div class="fill" id="progFill"></div><div class="knob" id="progKnob"></div></div></div>
    <span class="t" id="dur">0:00</span>
  </div>
  <div class="now">
    <div class="nt" id="nowTitle">未播放</div>
    <div class="na" id="nowArtist"></div>
  </div>
  <div class="ctrls">
    <button class="small" id="modeBtn" onclick="cycleMode()" title="播放模式">顺序</button>
    <button class="small" onclick="prevSong()" title="上一首"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="small" onclick="seekBy(-15)" title="快退15秒">−15</button>
    <button class="big" id="playBtn" onclick="togglePlay()" title="播放"><span id="playTxt">播放</span></button>
    <button class="big" id="pauseBtn" onclick="pauseNow()" title="暂停"><span id="pauseTxt">暂停</span></button>
    <button class="small" onclick="seekBy(15)" title="快进15秒">+15</button>
    <button id="stopBtn" onclick="stopSong()" title="停止" style="display:inline-flex;align-items:center;gap:4px;padding:7px 12px;background:#e74c3c;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer"><svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>停止</button>
    <button class="small" onclick="nextSong()" title="下一首"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="small" id="volBtn" onclick="toggleVol()" title="音量"><svg id="volOn" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg><svg id="volOff" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 3.2-3.2-1.4-1.4-3.2 3.2-3.2-3.2-1.4 1.4 3.2 3.2-3.2 3.2 1.4 1.4 3.2-3.2 3.2 3.2 1.4-1.4z"/></svg></button>
  </div>
</div>
<script>
// ===== PWA 注册 =====
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
// ===== 数据 =====
const INSTRUMENTS = ['二胡','唢呐','笛子','钢琴','小提琴','吉他','古筝','琵琶','大提琴','长笛','萨克斯','小号','手风琴','葫芦丝','埙','箫','扬琴','阮','口琴','陶笛'];
let songs = [];        // 全量歌单（来自 songs.json）
let shown = [];        // 当前筛选后展示的歌单（播放按此顺序）
let cur = -1;          // 当前播放歌在 shown 中的下标
let mode = 0;          // 0顺序 1循环 2单曲 3随机
const MODES = ['顺序','循环','单曲','随机'];
let favFilter = false;
let favs = {};
try{ favs = JSON.parse(localStorage.getItem('cloudFavs')||'{}'); }catch(e){ favs = {}; }

const audio = new Audio();
audio.preload = 'metadata';
const mvWrap = document.getElementById('mvWrap');
const mvPlayer = document.getElementById('mvPlayer');
mvPlayer.preload = 'metadata';
let curMedia = audio;   // 当前播放的媒体（audio 或 video）

// ===== 歌单加载 =====
function loadSongs(){
  fetch('songs.json', {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d=>{
      songs = Array.isArray(d.songs) ? d.songs.filter(s=>s && s.file) : [];
      applyFilter();
    })
    .catch(()=>{
      document.getElementById('list').innerHTML =
        '<div class="empty">歌单加载失败。<br>如果是本地双击打开（file://），浏览器不允许读取歌曲清单——<br>请部署到 GitHub 网页后使用（见 README 第一步）。</div>';
    });
}

// ===== 筛选与分类 =====
function classify(s){
  if(s && s.type === 'mv') return 'mv';
  const raw = String(s.title||'') + ' ' + String(s.artist||'');
  for(const i of INSTRUMENTS){ if(raw.includes(i)) return 'instrument'; }
  return 'song';
}
function applyFilter(){
  const kw = (document.getElementById('kw').value||'').trim().toLowerCase();
  shown = songs.filter(s=>{
    if(favFilter && !favs[s.file]) return false;
    if(!kw) return true;
    return (String(s.title||'')+' '+String(s.artist||'')).toLowerCase().includes(kw);
  });
  render();
}
// ===== 网上搜歌 =====
const SEARCH_API = localStorage.getItem('searchApi') || 'https://5b9f5db1.r27.cpolar.top';
(function(){
  try{
    const saved = JSON.parse(localStorage.getItem('cloudSearchResult')||'null');
    if(saved && saved.html){
      document.getElementById('oresults').innerHTML = saved.html;
      document.getElementById('okw').value = saved.kw || localStorage.getItem('cloudSearchKw')||'';
      document.getElementById('onlineSearch').style.display = 'block';
    }
  }catch(e){}
  renderHist();
})();
function toggleOnline(){
  const el = document.getElementById('onlineSearch');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
  if(el.style.display === 'block'){ renderHist(); const ok=document.getElementById('okw'); ok.value = ok.value || localStorage.getItem('cloudSearchKw')||''; ok.focus(); }
}
document.getElementById('okw').addEventListener('keydown', e=>{ if(e.key==='Enter') searchOnline(); });
function searchOnline(){
  const kw = document.getElementById('okw').value.trim();
  const box = document.getElementById('oresults');
  localStorage.setItem('cloudSearchKw', kw);
  if(!kw){ box.innerHTML = '<div class="empty">请输入歌名或歌手</div>'; return; }
  box.innerHTML = '<div class="empty">搜索中…（网易云+酷狗，自动过滤VIP）</div>';
  fetch(SEARCH_API + '/search?kw=' + encodeURIComponent(kw))
    .then(r=>r.json())
    .then(j=>{
      if(!j.playable || !j.playable.length){
        box.innerHTML = '<div class="empty">没有可播放的版本（VIP/失效已过滤）。<br>把歌名告诉我，我人工搜抖音/视频号找好版本。</div>';
        return;
      }
      const wants = JSON.parse(localStorage.getItem('cloudWants')||'[]');
      box.innerHTML = j.playable.map(r=>{
        const srcTxt = r.source==='netease' ? '网易' : r.source==='kugou' ? '酷狗' : 'B站';
        const srcCls = r.source==='netease' ? 'n' : r.source==='kugou' ? 'k' : 'b';
        const wanted = wants.some(w=>w.source===r.source && w.id===r.id);
        return '<div class="oitem">'
          + '<span class="src '+srcCls+'">'+srcTxt+'</span>'
          + '<div class="meta"><div class="t">'+esc(r.title)+'</div><div class="a">'+esc(r.artist||'')+(r.extra?' · '+esc(r.extra):'')+'</div></div>'
          + '<button class="play" onclick="tryOnline(this,\''+r.source+'\',\''+escJs(r.id)+'\')">试听</button>'
          + '<button class="'+(wanted?'wanted':'want')+'" onclick="wantAdd(this,\''+r.source+'\',\''+escJs(r.id)+'\')">'+(wanted?'已标记':'归队')+'</button>'
          + '</div>';
      }).join('') + '<div class="tip">共 '+j.playable.length+' 个可播版本，已过滤 '+j.blocked.length+' 个VIP/失效。B站为视频（含教学/翻唱/现场）。</div>';
      localStorage.setItem('cloudSearchResult', JSON.stringify({kw: kw, html: box.innerHTML}));
      saveHist(kw); renderHist();
    })
    .catch(e=>{
      box.innerHTML = '<div class="empty">搜索失败：'+esc(e.message)+'<br>电脑端需先启动搜索服务；手机端需配置云端接口。</div>';
    });
}
function tryOnline(btn, src, id){
  stopMedia();
  fetch(SEARCH_API + '/play?src='+src+'&id='+encodeURIComponent(id))
    .then(r=>r.json())
    .then(j=>{
      if(j.url){
        audio.src = j.url;
        audio.play().catch(()=>{});
        document.getElementById('nowTitle').textContent = '网上试听：'+(btn.closest('.oitem').querySelector('.t').textContent||'');
        document.getElementById('nowArtist').textContent = btn.closest('.oitem').querySelector('.a').textContent;
        setMediaSession(document.getElementById('nowTitle').textContent, document.getElementById('nowArtist').textContent);
        document.getElementById('lyricBox').style.display='none';
        loadOnlineLyric(src, id);
        syncControls();
      } else { alert('该版本暂不可播'); }
    })
    .catch(e=>alert('获取播放链接失败：'+e.message));
}
function loadOnlineLyric(src, id){
  const box = document.getElementById('lyricBox');
  if(src !== 'netease'){ box.style.display='none'; return; }
  fetch(SEARCH_API + '/lyric?src='+src+'&id='+encodeURIComponent(id))
    .then(r=>r.json())
    .then(j=>{
      if(j && j.lrc){
        const lrc = parseLrc(j.lrc);
        if(!lrc){ box.style.display='none'; return; }
        audio.ontimeupdate = ()=> updateProg(lrc);
        showLyric(lrc, audio.currentTime||0);
      } else { box.style.display='none'; }
    })
    .catch(()=>{ box.style.display='none'; });
}
function wantAdd(btn, src, id){
  let w = JSON.parse(localStorage.getItem('cloudWants')||'[]');
  const i = w.findIndex(x=>x.source===src && x.id===id);
  if(i >= 0){
    w.splice(i, 1);
    btn.className = 'want';
    btn.textContent = '归队';
  } else {
    w.push({source:src, id:id});
    btn.className = 'wanted';
    btn.textContent = '已标记';
  }
  localStorage.setItem('cloudWants', JSON.stringify(w));
}
function escJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function saveHist(kw){
  let h = JSON.parse(localStorage.getItem('cloudSearchHist')||'[]');
  h = [kw].concat(h.filter(x=>x!==kw)).slice(0,10);
  localStorage.setItem('cloudSearchHist', JSON.stringify(h));
}
function renderHist(){
  const el = document.getElementById('ohist');
  if(!el) return;
  const h = JSON.parse(localStorage.getItem('cloudSearchHist')||'[]');
  if(!h.length){ el.innerHTML=''; return; }
  el.innerHTML = '<span style="font-size:12px;color:var(--sub);margin-right:4px;">历史：</span>' + h.map(k=>
    '<span style="display:inline-block;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:3px 8px;font-size:13px;margin:2px;cursor:pointer;" onclick="histSearch(\''+escJs(k)+'\')">'+esc(k)+'<span style="margin-left:5px;color:#f66;cursor:pointer;" onclick="event.stopPropagation();histDel(\''+escJs(k)+'\')">×</span></span>'
  ).join('');
}
function histSearch(kw){ document.getElementById('okw').value = kw; searchOnline(); }
function histDel(kw){
  let h = JSON.parse(localStorage.getItem('cloudSearchHist')||'[]');
  h = h.filter(x=>x!==kw);
  localStorage.setItem('cloudSearchHist', JSON.stringify(h));
  renderHist();
}
function render(){
  const cats = {song:[], instrument:[], mv:[]};
  shown.forEach(s=>{ cats[classify(s)].push(s); });
  const st = document.getElementById('stat');
  let html = '';
  document.getElementById('list').className = favFilter ? 'fav-grid' : '';
  if(!songs.length){
    html = '<div class="empty">歌单还是空的。<br>把歌曲文件放进 <b>songs/</b> 文件夹，在 songs.json 里登记即可（详见 README）。</div>';
  } else if(!shown.length){
    html = '<div class="empty">没有符合筛选条件的歌曲。</div>';
  } else {
    const sec = (items, label, tagText, tagClass)=>{
      if(!items.length) return '';
      let s = '<div class="group-title">'+label+'（'+items.length+'）</div>';
      items.forEach((it,i)=>{
        const isPlaying = cur>=0 && shown[cur]===it;
        const fav = !!favs[it.file];
        const tag = tagText ? `<span class="tag ${tagClass}">${tagText}</span>` : '';
        s += `<div class="song${isPlaying?' playing':''}" onclick="playAt(${shown.indexOf(it)})" title="点击播放">
          <span class="idx">${isPlaying?'▶':shown.indexOf(it)+1}</span>
          <span class="meta">
            <div class="t">${esc(it.title||it.file.split('/').pop())}</div>
            <div class="a">${esc(it.artist||'')}</div>
          </span>
          ${tag}
          <button class="heart${fav?' on':''}" onclick="event.stopPropagation();toggleFav(it.file,this)" title="收藏">${fav?'♥':'♡'}</button>
        </div>`;
      });
      return s;
    };
    html += sec(cats.song,'歌曲','','');
    html += sec(cats.instrument,'器乐曲','器乐','i');
    html += sec(cats.mv,'MV','MV','m');
  }
  document.getElementById('list').innerHTML = '<div class="stat" id="stat">共 '+songs.length+' 首 · 显示 '+shown.length+' 首</div>' + html;
}
function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ===== 锁屏媒体控制（Media Session）=====
function setMediaSession(title, artist){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '音盒',
      artist: artist || '',
      album: '音盒 · 云端版',
    });
    if(!navigator.mediaSession._hooked){
      navigator.mediaSession.setActionHandler('play', ()=>{ if(cur>=0 && !playing) curMedia.play().catch(()=>{}); });
      navigator.mediaSession.setActionHandler('pause', ()=>pauseNow());
      navigator.mediaSession.setActionHandler('previoustrack', ()=>prevSong());
      navigator.mediaSession.setActionHandler('nexttrack', ()=>nextSong());
      navigator.mediaSession._hooked = true;
    }
  }catch(e){}
}
function setPlaybackState(p){
  if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState = p; }catch(e){} }
}
// ===== 播放 =====
function stopMedia(){
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  mvPlayer.pause();
  mvPlayer.removeAttribute('src');
  mvPlayer.load();
  mvWrap.style.display = 'none';
}
function playAt(i){
  if(i<0 || i>=shown.length) return;
  cur = i;
  const s = shown[i];
  stopMedia();
  if(s.type === 'mv'){
    curMedia = mvPlayer;
    mvPlayer.src = encodeURI(s.file);
    mvWrap.style.display = 'block';
  } else {
    curMedia = audio;
    audio.src = encodeURI(s.file);
  }
  const lrc = parseLrc(s.lrc||'');
  curMedia.onloadedmetadata = ()=>{ durEl.textContent = fmt(curMedia.duration); };
  curMedia.play().catch(e=>{ if(e.name!=='AbortError') document.getElementById('nowTitle').textContent='播放失败: '+e.name; });
  document.getElementById('nowTitle').textContent = s.title || s.file.split('/').pop();
  document.getElementById('nowArtist').textContent = s.artist || '';
  setMediaSession(s.title || s.file.split('/').pop(), s.artist || '');
  showLyric(lrc, 0);
  curMedia.ontimeupdate = ()=> updateProg(lrc);
  curMedia.onended = ()=> nextSong(true);
  syncControls();
  render();
}
let playing = false;
function markPlaying(v){ playing = v; setPlaybackState(v?'playing':'paused'); syncControls(); }
audio.addEventListener('play', ()=>{ markPlaying(true); });
audio.addEventListener('pause', ()=>{ markPlaying(false); });
audio.addEventListener('ended', ()=>{ markPlaying(false); });
mvPlayer.addEventListener('play', ()=>{ markPlaying(true); });
mvPlayer.addEventListener('pause', ()=>{ markPlaying(false); });
mvPlayer.addEventListener('ended', ()=>{ markPlaying(false); });
function pauseNow(){ if(playing) curMedia.pause(); }
function togglePlay(){
  if(cur<0){ if(shown.length) playAt(0); return; }
  if(!playing){
    curMedia.play().catch(e=>{ if(e.name!=='AbortError') document.getElementById('nowTitle').textContent='播放失败: '+e.name; });
  }
}
function syncControls(){
  const pb = document.getElementById('playBtn');
  const pab = document.getElementById('pauseBtn');
  if(pb) pb.disabled = playing;
  if(pab) pab.disabled = !playing;
}
function stopSong(){
  cur = -1;
  stopMedia();
  document.getElementById('nowTitle').textContent = '-- 未播放 --';
  document.getElementById('nowArtist').textContent = '';
  setMediaSession('', '');
  setPlaybackState('none');
  document.getElementById('lyricBox').style.display = 'none';
  curEl.textContent = '0:00';
  durEl.textContent = '0:00';
  fillEl.style.width = '0%';
  knobEl.style.left = '0%';
  syncControls();
  render();
}
function nextSong(auto){
  if(!shown.length) return;
  let next;
  if(mode===3){ next = Math.floor(Math.random()*shown.length); }
  else if(mode===2){ next = cur; }
  else {
    next = cur + 1;
    if(next >= shown.length){ next = mode===1 ? 0 : (auto ? -1 : 0); }
  }
  if(next<0){ curMedia.pause(); curMedia.currentTime = 0; return; }
  playAt(next);
}
function prevSong(){
  if(cur<0 || !shown.length) return;
  if(curMedia.currentTime > 3){ curMedia.currentTime = 0; return; }
  playAt((cur-1+shown.length) % shown.length);
}
function seekBy(delta){
  if(!curMedia.duration || Number.isNaN(curMedia.duration)) return;
  const t = Math.min(curMedia.duration, Math.max(0, (curMedia.currentTime||0) + delta));
  curMedia.currentTime = t;
  updateProg(parseLrc(shown[cur] ? shown[cur].lrc : '') || null);
}
function cycleMode(){ mode = (mode+1)%4; document.getElementById('modeBtn').textContent = MODES[mode]; }

// ===== 进度 =====
const curEl = document.getElementById('cur'), durEl = document.getElementById('dur');
const fillEl = document.getElementById('progFill'), knobEl = document.getElementById('progKnob');
function updateProg(lrc){
  const t = curMedia.currentTime || 0, d = curMedia.duration || 0;
  curEl.textContent = fmt(t);
  if(d){ const p = t/d*100; fillEl.style.width = p+'%'; knobEl.style.left = p+'%'; }
  showLyric(lrc, t);
}
function fmt(sec){
  sec = Math.max(0, Math.floor(sec||0));
  const m = Math.floor(sec/60), s = sec%60;
  return m+':'+String(s).padStart(2,'0');
}
(function(){
  const bar = document.getElementById('progBar');
  function calcP(clientX){
    const r = bar.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX-r.left)/r.width));
  }
  function preview(p){
    if(!curMedia.duration) return;
    curEl.textContent = fmt(p * curMedia.duration);
    fillEl.style.width = (p*100)+'%'; knobEl.style.left = (p*100)+'%';
  }
  function applySeek(p){
    if(!curMedia.duration) return;
    curMedia.currentTime = p * curMedia.duration;
  }
  bar.addEventListener('click', e=> applySeek(calcP(e.clientX)));
  let dragging = false, dragP = 0;
  bar.addEventListener('mousedown', e=>{ dragging = true; dragP = calcP(e.clientX); preview(dragP); e.preventDefault(); });
  window.addEventListener('mousemove', e=>{ if(dragging){ dragP = calcP(e.clientX); preview(dragP); } });
  window.addEventListener('mouseup', ()=>{ if(dragging){ dragging = false; applySeek(dragP); } });
  bar.addEventListener('touchstart', e=>{ dragging = true; dragP = calcP(e.touches[0].clientX); preview(dragP); }, {passive:false});
  bar.addEventListener('touchmove', e=>{ if(dragging){ dragP = calcP(e.touches[0].clientX); preview(dragP); e.preventDefault(); } }, {passive:false});
  bar.addEventListener('touchend', ()=>{ if(dragging){ dragging = false; applySeek(dragP); } });
})();

// ===== 音量 =====
let muted = false;
function toggleVol(){
  muted = !muted;
  audio.muted = muted;
  mvPlayer.muted = muted;
  document.getElementById('volOn').style.display = muted ? 'none' : '';
  document.getElementById('volOff').style.display = muted ? '' : 'none';
}

// ===== 收藏（本设备）=====
function toggleFav(file, btn){
  if(favs[file]){ delete favs[file]; } else { favs[file] = 1; }
  localStorage.setItem('cloudFavs', JSON.stringify(favs));
  applyFilter();
}
function toggleFavFilter(){
  favFilter = !favFilter;
  document.getElementById('favFilter').classList.toggle('on', favFilter);
  applyFilter();
}

// ===== 歌词 =====
function parseLrc(text){
  text = String(text||'');
  if(!text.trim()) return null;
  const re = /\[(\d+):(\d+(?:\.\d+)?)\]/g;
  if(!re.test(text)){
    return {plain: text.split(/\n/).map(s=>s.trim()).filter(Boolean)};
  }
  re.lastIndex = 0;
  const out = [];
  let m, last = 0, lines = text.split(/\n/);
  for(const ln of lines){
    let t = null;
    while((m = re.exec(ln)) !== null){ t = (+m[1])*60 + (+m[2]); }
    const content = ln.replace(re,'').trim();
    if(content){ out.push({t: t!=null?t:last, text:content}); if(t!=null) last = t; }
  }
  out.sort((a,b)=>a.t-b.t);
  return out.length ? out : null;
}
function showLyric(lrc, t){
  const box = document.getElementById('lyricBox');
  if(!lrc || curMedia === mvPlayer){ box.style.display='none'; return; }
  if(lrc.plain){
    box.classList.add('plain');
    box.style.textAlign = 'center';
    box.innerHTML = lrc.plain.map(s=>'<div class="lrcline">'+s+'</div>').join('');
    box.style.display = 'block';
    box.scrollTop = 0;
    return;
  }
  box.classList.remove('plain');
  let line = '';
  for(let i=lrc.length-1;i>=0;i--){ if(lrc[i].t <= t+0.2){ line = lrc[i].text; break; } }
  if(line){ box.textContent = line; box.style.display = 'block'; }
  else { box.style.display = 'none'; }
}
// 无歌词时显示当前歌名
audio.addEventListener('play', ()=>{
  const s = shown[cur];
  if(s && !parseLrc(s.lrc||'')){
    const box = document.getElementById('lyricBox');
    box.textContent = s.title||''; box.style.display='block';
  }
});
audio.addEventListener('pause', ()=>{
  if(!audio.currentTime){ document.getElementById('lyricBox').style.display='none'; }
});

// ===== 启动 =====
document.getElementById('kw').addEventListener('input', applyFilter);
document.getElementById('modeBtn').textContent = MODES[mode];
syncControls();
loadSongs();
</script>
